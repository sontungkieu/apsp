# Full SD1.5 experiment plan for `python -m apsp.run_project` (docs/FULL_EXPERIMENT_PLAN.md §9).
# Jobs run in this order when their dependencies, PREREG markers, gates, budget, price and watchdog allow it.
# Budget/price fields are RESEARCH/USER decisions. Agents never fill them in.
# financial_cap_mode: none = the user's explicit decision of 2026-10-16 (DECISIONS D47) to drop the rental budget gate
# and the price ceiling for this experiment suite. Null budget fields WITHOUT this mode still block every GPU job.
# Spend is still recorded (budget.json) for reporting. Episode compute caps, DP masks, protocol and PREREG gates are
# unchanged. Plan v1.3: the watchdog is monitor-only (no stop path) until the whole project is complete.
project_run: apsp_full_sd15_v1
instance_id: 56353913              # measurement machine after PREREG-A amendment 2 (owner, 2026-10-17): RTX 4090 48 GB; 56272061 deleted
measurement_gpu: null              # from runtime_fingerprint.json of the calibration run (not from the UI)
financial_cap_mode: none           # explicit; see header
approved_total_usd: null           # not used in financial_cap_mode none
approved_max_usd_per_h: null       # not used in financial_cap_mode none
approved_max_wall_hours: null
bandwidth_storage_reserve_usd: null
forecast_safety: 1.25              # job forecast multiplier in the budget preflight (approved_budget mode only)
pack_stop_margin_min: 20           # time kept for packing artifacts and stopping
workload_pidfile: ${APSP_STORE}/run_project.pid       # read by the monitor-only watchdog (alerts)
# Plan v1.3 / user order 2026-10-16: NO instance stop before the whole project is complete. No finished marker:
# the watchdog runs --monitor-only (no stop path); run_project only writes its project state (waiting_research /
# incomplete_blocked), never a completion.
stop_instance_before_project_complete: false
project_state_file: ${APSP_STORE}/project_state.json
scope: [sd15]
prereg: {A: null, B: null, C: null}   # informational; the gate reads docs/PREREG_SIGNED/ markers
resume: true
gpu_workers: 1
stop_instance_on_deadline: false   # plan v1.3: never stop before project completion
destroy_instance: false
runs_root: ${APSP_STORE}/project_runs
watchdog_state_dir: ${APSP_STORE}/watchdog
env:
  APSP_STORE: ${APSP_STORE}
  POOL_DIR: ${APSP_STORE}/prompts
  MACHINE_ID: vast_56353913_rtx4090_48g
  CAL: ${APSP_STORE}/runs/calib1
  COSTS: ${APSP_STORE}/runs/calib1/p0/m2/generator_costs.json
  TUNED: ${APSP_STORE}/tuned
  FROZEN: ${APSP_STORE}/frozen_operating_point.json
  # PREREG-A (2026-10-17): preview_dtype fp16 + vae_decode_chunk 1 written to pilot.yaml. Only the parts bound to that
  # configuration are re-measured under the new EPH in calibA (M2 table, equivalence, M2b, forecast, EPH freeze);
  # calib1 stays as measured (P1 jobs above are not re-run).
  CAL_A: ${APSP_STORE}/runs/calibA
  COSTS_A: ${APSP_STORE}/runs/calibA/p0/m2/generator_costs.json
  FROZEN_EPH: ${APSP_STORE}/frozen_eph.json

# est_hours: GPU wall hours used by the budget preflight. Values marked (3090) are the RTX 3090 estimates of
# docs/PILOT_RUN_PLAN.md, deliberately conservative for the 4090 until `p1_forecast` replaces them with measured ones.
jobs:
  # ---------------------------------------------------------------- P1 calibration (no PREREG; engineering) ----
  - {id: p1_env, enabled: false, phase: P1, gpu: true, est_hours: 0.15, timeout_min: 60,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 00_setup 01_pytest 02_env_check 02b_fingerprint 03_model && ${APSP_STORE}/venv-gpu/bin/python scripts/vram_check.py --out ${CAL}/p0/vram_check.json && /usr/local/cuda/bin/nvcc -O2 -arch=sm_89 -o ${CAL}/p0/cuda_memtest scripts/cuda_memtest.cu && ${CAL}/p0/cuda_memtest 2 600 > ${CAL}/p0/cuda_memtest.json",
     notes: "VRAM must pass both the torch pattern check and the independent CUDA memtest (docs/VRAM_FAULT_56267276.md)",
     outputs: ["${CAL}/p0/runtime_fingerprint.json", "${CAL}/p0/vram_check.json", "${CAL}/p0/cuda_memtest.json", "${CAL}/p0/M1_model.json"]}
  - {id: p1_pool_check, enabled: false, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.25, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 30_pool_full_check", outputs: ["${CAL}/calib/pool_full_check.json"]}
  - {id: p1_m3m9, enabled: false, phase: P1, gpu: true, needs: [p1_pool_check], gates: [pool_check_calibration], est_hours: 2.2, timeout_min: 180,
     notes: "(3090) 50 calibration x bank 0 + fp32 preview, 20 subset x bank 1 clean collector",
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 31_calib_m3m9 32_calib_summary", outputs: ["${CAL}/calib/m3m9.json"]}
  - {id: p1_chunk, enabled: false, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.35, timeout_min: 40,
     cmd: "RUN_ID=calib1 CHUNK_N=50 bash scripts/gpu_smoke.sh 34_calib_chunk", outputs: ["${CAL}/calib/chunk.json"]}
  - {id: p1_m2, enabled: false, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.7, timeout_min: 120,
     notes: "k = 1,2,3,4,8,12,16: every k of the pilot methods and of the B4b grid (16,12,8,4,3,2,1)",
     cmd: "RUN_ID=calib1 M2_KS='1 2 3 4 8 12 16' bash scripts/gpu_smoke.sh 35_m2 36_m2_merge",
     outputs: ["${COSTS}"]}
  - {id: p1_equivalence, enabled: false, phase: P1, gpu: true, needs: [p1_m3m9], est_hours: 0.35, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 33_calib_equivalence", outputs: ["${CAL}/calib/equivalence.json"]}
  - {id: p1_m2b, enabled: false, phase: P1, gpu: true, needs: [p1_m2, p1_pool_check], gates: [pool_check_calibration], est_hours: 0.25, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 37_m2b", outputs: ["${CAL}/calib/m2b.json"]}
  - {id: p1_m2_rest, phase: P1, gpu: true, needs: [p1_m2], est_hours: 1.5, enabled: false, timeout_min: 150,
     notes: "k = 5..7, 9..11, 13..15: only for any-N BoN / extended grids; not needed by this plan",
     cmd: "RUN_ID=calib1 M2_KS='5 6 7 9 10 11 13 14 15' bash scripts/gpu_smoke.sh 35_m2 36_m2_merge", outputs: ["${COSTS}"]}
  - {id: p1_forecast, enabled: false, phase: P1, gpu: false, needs: [p1_m3m9, p1_m2, p1_m2b],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.forecast --m3m9 ${CAL}/calib/m3m9.json --costs ${COSTS} --m2b ${CAL}/calib/m2b.json --price ${PRICE_USD_H} --out ${CAL}/forecast",
     outputs: ["${CAL}/forecast/phase_forecast.json"]}
  # First real-data quality-cost table (D49): FIXED, untuned baselines only, online, on the 50 calibration prompts
  # (no PREREG needed for that split). Descriptive engineering evidence: never used to select methods, thresholds,
  # pilot size or epsilon; runs after the forecast so it cannot influence it. Not a claim set.
  - {id: p1_bench_calib, enabled: false, phase: P1, gpu: true, needs: [p1_forecast], gates: [pool_check_calibration], est_hours: 1.5,
     timeout_min: 300,
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.gpu.benchmark --prompt-pool ${POOL_DIR}/prompt_pool.parquet --split calibration --banks 0 1 --methods single single32 bon:2 bon:4 bon:8 psp --costs ${COSTS} --out ${CAL}/bench_calib",
     outputs: ["${CAL}/bench_calib/episodes.jsonl", "${CAL}/bench_calib/manifest.json"]}
  - {id: p1_report_calib, enabled: false, phase: P1, gpu: false, needs: [p1_bench_calib],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.quality_cost --run ${CAL}/bench_calib --out ${CAL}/bench_calib/report",
     outputs: ["${CAL}/bench_calib/report/quality_cost.json", "${CAL}/bench_calib/report/quality_cost.csv"]}
  - {id: p1_calibration_report, enabled: false, phase: P1, gpu: false, needs: [p1_report_calib],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.calibration_report --cal ${CAL} --out ${CAL}/report",
     outputs: ["${CAL}/report/calibration_report.md", "${CAL}/report/calibration_quality_cost.csv"]}
  # PREREG-A amendment 2 (docs/PREREG_PROPOSALS/PREREG_A_AMENDMENT_2_machine.md): P1 jobs above were measured on
  # 56272061 (calib1, restored from the laptop copy: pool check, M3/M9, chunk, calibration table) and are not re-run.
  # On 56353913 only the environment/model check runs, then the machine-bound values (EPH, M2, M2b, equivalence).
  # The VRAM gate passed on this GPU on 2026-10-17 (scripts/vram_gate.sh, third-party + own CUDA test).
  - {id: a2_env, phase: P1, gpu: true, est_hours: 0.2, timeout_min: 90,
     cmd: "RUN_ID=calibA bash scripts/gpu_smoke.sh 00_setup 02_env_check 02b_fingerprint 03_model",
     outputs: ["${CAL_A}/p0/runtime_fingerprint.json", "${CAL_A}/p0/M1_model.json"]}
  # ---------------------------------------------------------------- P1a: re-measure what fp16/chunk 1 changes ----
  # EPH hashes preview_dtype, vae_decode_chunk and the generation code; GCH hashes the EPH; ver/fin include the VAE
  # decode whose chunk changed (null = batch -> 1). M3 (fp16 was already the effective preview dtype), pool check,
  # chunk, M9 and the calibration bench are not affected by the binding and are not re-run.
  - {id: p1a_eph, phase: P1, gpu: true, needs: [a2_env], est_hours: 0.05, timeout_min: 20,
     notes: "through gpu_smoke.sh: the EPH includes its runtime env (CUBLAS_WORKSPACE_CONFIG), as in every GPU step",
     cmd: "RUN_ID=calibA FROZEN_EPH=${FROZEN_EPH} bash scripts/gpu_smoke.sh 38_eph 39_freeze_eph",
     outputs: ["${CAL_A}/p0/eph/model.json", "${FROZEN_EPH}"]}
  - {id: p1a_m2, phase: P1, gpu: true, needs: [p1a_eph], est_hours: 0.5, timeout_min: 120,
     cmd: "RUN_ID=calibA M2_KS='1 2 3 4 8 12 16' bash scripts/gpu_smoke.sh 35_m2 36_m2_merge", outputs: ["${COSTS_A}"]}
  - {id: p1a_equivalence, phase: P1, gpu: true, needs: [p1a_eph], est_hours: 0.1, timeout_min: 40,
     notes: "fresh: collector and pinned PSP reference both generated now (calib1 used stored M3 tensors)",
     cmd: "RUN_ID=calibA bash scripts/gpu_smoke.sh 33b_equivalence_fresh", outputs: ["${CAL_A}/calib/equivalence_fresh.json"]}
  - {id: p1a_m2b, phase: P1, gpu: true, needs: [p1a_m2], gates: [pool_check_calibration], est_hours: 0.1, timeout_min: 40,
     cmd: "RUN_ID=calibA bash scripts/gpu_smoke.sh 37_m2b", outputs: ["${CAL_A}/calib/m2b.json"]}
  - {id: p1a_forecast, phase: P1, gpu: false, needs: [p1a_m2b],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.forecast --m3m9 ${CAL}/calib/m3m9.json --costs ${COSTS_A} --m2b ${CAL_A}/calib/m2b.json --price ${PRICE_USD_H} --out ${CAL_A}/forecast",
     outputs: ["${CAL_A}/forecast/phase_forecast.json"]}
  # ---------------------------------------------------------------- P2 bank (PREREG-A) -------------------------
  # bank start needs only what affects data validity: frozen EPH (p1a_eph), the locked cost table (p1a_m2, used by
  # later replay), the exact equivalence check. M2b runs before it only because it precedes in plan order (exclusive
  # GPU for latency); the forecast is a report and never gates collection.
  - {id: p2_bank, phase: P2, gpu: true, needs: [p1a_eph, p1a_m2, p1a_equivalence], prereg: [A], est_hours: 2.2, timeout_min: 900,
     notes: "train_fit 190 + train_dev 50 prompts x 2 banks; forecast 2.15 h on 56272061; x0 latents stored (A16)",
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} EXPECT_EPH=${FROZEN_EPH} bash scripts/gpu_smoke.sh 40_bank", outputs: ["${APSP_STORE}/banks/PILOT/manifest.json"]}
  # ---------------------------------------------------------------- P3 baselines on train/dev (PREREG-A) -------
  - {id: p3_tune, phase: P3, gpu: false, needs: [p2_bank], prereg: [A],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.sim.tune_baselines --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --out ${TUNED}",
     outputs: ["${TUNED}/methods_frozen.json"]}
  - {id: p3_bench_dev, phase: P3, gpu: true, needs: [p3_tune], prereg: [A], est_hours: 3.3, timeout_min: 900,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} bash scripts/gpu_smoke.sh 42_bench_dev", outputs: ["${APSP_STORE}/runs/pilot1/bench_dev/episodes.jsonl"]}
  - {id: p3_report_dev, phase: P3, gpu: false, needs: [p3_bench_dev], prereg: [A],
     notes: "descriptive table (not_concludable until evaluation.yaml is approved); no freeze here",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.quality_cost --run ${APSP_STORE}/runs/pilot1/bench_dev --out ${APSP_STORE}/runs/pilot1/bench_dev/report",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_dev/report/quality_cost.json"]}
  - {id: p3_anchor_proposal, phase: P3, gpu: false, needs: [p2_bank], prereg: [A],
     notes: "PREREG-B proposal inputs from train_fit only (anchor, tau_prac, epsilon, r_fail, sigma_R, power)",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.anchor --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --proposal-only --out ${APSP_STORE}/runs/pilot1/anchor",
     outputs: ["${APSP_STORE}/runs/pilot1/anchor"]}
  # PREREG-B protocol-lock snapshot (owner authorization 2026-10-17, docs/PREREG.md): online train_fit anchor, then
  # every B value from train_fit/train_dev by the locked formulas (apsp.reports.lock_b), before any val outcome.
  - {id: p3_anchor_online, phase: P3, gpu: true, needs: [p3_tune], prereg: [A], est_hours: 1.1, timeout_min: 360,
     notes: "B2 anchor: PSP-default and BoN-4 online on train_fit (190 prompts x 2 banks), paired",
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} bash scripts/gpu_smoke.sh 41b_anchor_online", outputs: ["${APSP_STORE}/runs/pilot1/anchor_online/episodes.jsonl"]}
  - {id: p3_lock_b, phase: P3, gpu: false, needs: [p3_bench_dev, p3_anchor_online, p3_anchor_proposal], prereg: [A],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.lock_b --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --anchor-online ${APSP_STORE}/runs/pilot1/anchor_online --dev-run ${APSP_STORE}/runs/pilot1/bench_dev --anchor-replay ${APSP_STORE}/runs/pilot1/anchor --val-guard ${APSP_STORE}/runs/pilot1/bench_val ${APSP_STORE}/runs/pilot1/bench_val_ext ${APSP_STORE}/runs/pilot1/val_access.jsonl",
     outputs: ["docs/PREREG_PROPOSALS/PREREG_B_LOCKED.json", "docs/PREREG_SIGNED/PREREG-B.json", "configs/evaluation_locked.yaml"]}
  - {id: p3_gates_b, phase: P3, gpu: false, needs: [p3_lock_b], prereg: [B],
     notes: "G1 online-replay discrepancy (train_dev) + G2-quality O1-replay - B3; writes the G2_EVALUATED marker",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.gates_b --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --dev-run ${APSP_STORE}/runs/pilot1/bench_dev --out ${APSP_STORE}/runs/pilot1/gates_b.json",
     outputs: ["${APSP_STORE}/runs/pilot1/gates_b.json", "docs/PREREG_SIGNED/G2_EVALUATED.json"]}
  - {id: p3_freeze_dev, phase: P3, gpu: false, needs: [p3_report_dev], prereg: [A], gates: [evaluation_approved], enabled: false,
     notes: "superseded by p4_select_dev (the dev selection includes the RL candidates)",
     cmd: "RUN_ID=pilot1 bash scripts/gpu_smoke.sh 43_report_dev", outputs: ["${FROZEN}"]}
  - {id: p3_headroom, phase: P3, gpu: false, needs: [p2_bank], prereg: [B],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.headroom --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} > ${APSP_STORE}/runs/pilot1/headroom.json",
     outputs: ["${APSP_STORE}/runs/pilot1/headroom.json"]}
  # ---------------------------------------------------------------- P4 controller (PREREG-B + G2) --------------
  - {id: p4_rl_train, phase: P4, gpu: false, needs: [p3_gates_b], prereg: [B], gates: ["marker:G2_EVALUATED"],
     cmd: "for s in 0 1 2; do ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --config configs/pilot.yaml --train --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --iterations 200 --seed $s --out ${APSP_STORE}/rl/seed$s || exit 1; done",
     outputs: ["${APSP_STORE}/rl/seed0/artifact.json", "${APSP_STORE}/rl/seed1/artifact.json", "${APSP_STORE}/rl/seed2/artifact.json"]}
  - {id: p4_bench_dev_rl, phase: P4, gpu: true, needs: [p4_rl_train], prereg: [B], est_hours: 0.92, timeout_min: 300,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} RL_METHODS='rl:${APSP_STORE}/rl/seed0/artifact.json@0.5 rl:${APSP_STORE}/rl/seed0/artifact.json@1.0 rl:${APSP_STORE}/rl/seed1/artifact.json@0.5 rl:${APSP_STORE}/rl/seed1/artifact.json@1.0 rl:${APSP_STORE}/rl/seed2/artifact.json@0.5 rl:${APSP_STORE}/rl/seed2/artifact.json@1.0' bash scripts/gpu_smoke.sh 42b_bench_dev_rl",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_dev_rl/episodes.jsonl"]}
  - {id: p4_select_dev, phase: P4, gpu: false, needs: [p3_bench_dev, p4_bench_dev_rl], prereg: [B], gates: [evaluation_approved],
     notes: "operating point, G3/G3b/G4 candidates and contrast manifest frozen on train_dev before any val look",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.select_dev --runs ${APSP_STORE}/runs/pilot1/bench_dev ${APSP_STORE}/runs/pilot1/bench_dev_rl --config configs/evaluation_locked.yaml --snapshot docs/PREREG_PROPOSALS/PREREG_B_LOCKED.json --out ${FROZEN}",
     outputs: ["${FROZEN}"]}
  # ---------------------------------------------------------------- P5 confirmation on val (PREREG-B) ----------
  - {id: p5_bench_val, phase: P5, gpu: true, needs: [p4_select_dev], prereg: [B], gates: [evaluation_approved],
     est_hours: 2.8, timeout_min: 900,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} FROZEN=${FROZEN} bash scripts/gpu_smoke.sh 44_bench_val 45_report_val",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_val/report/quality_cost.json"]}
  - {id: p5_confirm_look1, phase: P5, gpu: false, needs: [p5_bench_val], prereg: [B],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.confirm --runs ${APSP_STORE}/runs/pilot1/bench_val --frozen ${FROZEN} --config configs/evaluation_locked.yaml --look 1 --val-log ${APSP_STORE}/runs/pilot1/val_access.jsonl --out ${APSP_STORE}/runs/pilot1/confirm_look1.json",
     outputs: ["${APSP_STORE}/runs/pilot1/confirm_look1.json"]}
  - {id: p5_val_ext, phase: P5, gpu: true, needs: [p5_confirm_look1], prereg: [B], est_hours: 3.0, timeout_min: 900,
     notes: "look 2 only if a primary contrast is INC after look 1 (locked val_ext count); otherwise records not needed",
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} FROZEN=${FROZEN} bash scripts/look2.sh run", outputs: ["${APSP_STORE}/runs/pilot1/look2_status.json"]}
  - {id: p5_confirm_final, phase: P5, gpu: false, needs: [p5_val_ext], prereg: [B],
     cmd: "RUN_ID=pilot1 FROZEN=${FROZEN} bash scripts/look2.sh report", outputs: ["${APSP_STORE}/runs/pilot1/confirm_final.json"]}
  # ---------------------------------------------------------------- P7 ablations (train/dev only; E7) ---------
  - {id: p7_rl_variants, phase: P7, gpu: false, needs: [p4_rl_train], prereg: [B],
     notes: "RL ablation variants (3 seeds each): nopaid, traj (paid features), per-cap policies; replay training on train_fit",
     cmd: "for s in 0 1 2; do ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --train --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --iterations 200 --seed $s --variant nopaid --out ${APSP_STORE}/rl_ablate/nopaid_seed$s && ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --train --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --iterations 200 --seed $s --variant traj --out ${APSP_STORE}/rl_ablate/traj_seed$s && ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --train --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --iterations 200 --seed $s --alphas 0.5 --out ${APSP_STORE}/rl_ablate/a05/percap_seed$s && ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --train --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --iterations 200 --seed $s --alphas 1.0 --out ${APSP_STORE}/rl_ablate/a10/percap_seed$s || exit 1; done",
     outputs: ["${APSP_STORE}/rl_ablate/nopaid_seed2/artifact.json", "${APSP_STORE}/rl_ablate/traj_seed2/artifact.json", "${APSP_STORE}/rl_ablate/a10/percap_seed2/artifact.json"]}
  - {id: p7_bench_dev_ablate, phase: P7, gpu: true, needs: [p7_rl_variants], prereg: [B], est_hours: 2.8, timeout_min: 600,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} RL_METHODS='rl:${APSP_STORE}/rl_ablate/nopaid_seed0/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/nopaid_seed0/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/traj_seed0/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/traj_seed0/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/a05/percap_seed0/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/a10/percap_seed0/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/nopaid_seed1/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/nopaid_seed1/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/traj_seed1/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/traj_seed1/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/a05/percap_seed1/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/a10/percap_seed1/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/nopaid_seed2/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/nopaid_seed2/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/traj_seed2/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/traj_seed2/artifact.json@1.0 rl:${APSP_STORE}/rl_ablate/a05/percap_seed2/artifact.json@0.5 rl:${APSP_STORE}/rl_ablate/a10/percap_seed2/artifact.json@1.0' RL_OUT=bench_dev_ablate bash scripts/gpu_smoke.sh 42b_bench_dev_rl",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_dev_ablate/episodes.jsonl"]}
  - {id: p7_ablations_report, phase: P7, gpu: false, needs: [p7_bench_dev_ablate, p4_select_dev], prereg: [B],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.ablations --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS_A} --frozen ${FROZEN} --runs ${APSP_STORE}/runs/pilot1/bench_dev ${APSP_STORE}/runs/pilot1/bench_dev_rl ${APSP_STORE}/runs/pilot1/bench_dev_ablate --out ${APSP_STORE}/runs/pilot1/ablations.json",
     outputs: ["${APSP_STORE}/runs/pilot1/ablations.json"]}
  # ---------------------------------------------------------------- P6 test, P7 ablations, P8 extension ---------
  - {id: p6_eval_setup, phase: P6, gpu: false, needs: [a2_env],
     notes: "separate evaluator venvs (HPS v2.1, official GenEval + mmdet 2.x); no image generated",
     cmd: "APSP_STORE=${APSP_STORE} bash env/setup_evaluators.sh all", outputs: ["${APSP_STORE}/evaluators/geneval_models/SHA256SUMS"]}
  - {id: p6_geneval_prompts, phase: P6, gpu: false, needs: [p6_eval_setup],
     cmd: "mkdir -p ${APSP_STORE}/geneval && ${APSP_STORE}/venv-gpu/bin/python scripts/geneval_tools.py prompts --metadata ${APSP_STORE}/evaluators/geneval/prompts/evaluation_metadata.jsonl --out ${APSP_STORE}/geneval/prompts.jsonl",
     outputs: ["${APSP_STORE}/geneval/prompts.jsonl"]}
  # PREREG-C protocol-lock snapshot after the val confirmation and before any GenEval image (apsp.reports.lock_c)
  - {id: p6_lock_c, phase: P6, gpu: false, needs: [p5_confirm_final, p6_geneval_prompts], prereg: [B],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.lock_c --frozen ${FROZEN} --tuned ${TUNED} --rl-root ${APSP_STORE}/rl --costs ${COSTS_A} --frozen-eph ${FROZEN_EPH} --geneval-repo ${APSP_STORE}/evaluators/geneval --geneval-models ${APSP_STORE}/evaluators/geneval_models --geneval-run ${APSP_STORE}/runs/pilot1/geneval --test-methods-out ${APSP_STORE}/test_methods.json",
     outputs: ["docs/PREREG_PROPOSALS/PREREG_C_LOCKED.json", "docs/PREREG_SIGNED/PREREG-C.json", "${APSP_STORE}/test_methods.json"]}
  - {id: p6_geneval_gen, phase: P6, gpu: true, needs: [p6_lock_c], prereg: [C], est_hours: 41.0, timeout_min: 3600,
     notes: "553 official prompts x 4 episodes (banks 0-3) x locked test methods, one delivered image per episode",
     cmd: "RUN_ID=pilot1 COSTS=${COSTS_A} GENEVAL_PROMPTS=${APSP_STORE}/geneval/prompts.jsonl TEST_METHODS=${APSP_STORE}/test_methods.json bash scripts/gpu_smoke.sh 46_geneval",
     outputs: ["${APSP_STORE}/runs/pilot1/geneval/episodes.jsonl"]}
  - {id: p6_geneval_eval, phase: P6, gpu: true, needs: [p6_geneval_gen], prereg: [C], est_hours: 1.5, timeout_min: 600,
     cmd: "APSP_STORE=${APSP_STORE} RUN=${APSP_STORE}/runs/pilot1/geneval PROMPTS=${APSP_STORE}/geneval/prompts.jsonl SNAP=docs/PREREG_PROPOSALS/PREREG_C_LOCKED.json bash scripts/geneval_eval.sh",
     outputs: ["${APSP_STORE}/runs/pilot1/geneval/geneval_report.json"]}
  - {id: p6_hps, phase: P6, gpu: true, needs: [p6_geneval_gen], prereg: [C], est_hours: 1.5, timeout_min: 600,
     notes: "HPS v2.1 (diagnostic, evaluation only) on the GenEval test images and the val images",
     cmd: "HF_HOME=${APSP_STORE}/hf ${APSP_STORE}/venv-hps/bin/python -m apsp.gpu.evaluators.independent --run ${APSP_STORE}/runs/pilot1/geneval --metric hpsv2 --prompts-jsonl ${APSP_STORE}/geneval/prompts.jsonl > ${APSP_STORE}/runs/pilot1/geneval/hps_summary.json && HF_HOME=${APSP_STORE}/hf ${APSP_STORE}/venv-hps/bin/python -m apsp.gpu.evaluators.independent --run ${APSP_STORE}/runs/pilot1/bench_val --metric hpsv2 --prompt-pool ${POOL_DIR}/prompt_pool.parquet > ${APSP_STORE}/runs/pilot1/bench_val/hps_summary.json",
     outputs: ["${APSP_STORE}/runs/pilot1/geneval/hps_summary.json", "${APSP_STORE}/runs/pilot1/bench_val/hps_summary.json"]}
  - {id: p6_test_report, phase: P6, gpu: false, needs: [p6_geneval_eval, p6_hps], prereg: [C],
     notes: "IR / e2e / failures / HPS on the GenEval test run with the locked evaluation config (secondary, descriptive)",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.quality_cost --run ${APSP_STORE}/runs/pilot1/geneval --config configs/evaluation_locked.yaml --out ${APSP_STORE}/runs/pilot1/geneval/report",
     outputs: ["${APSP_STORE}/runs/pilot1/geneval/report/quality_cost.json"]}

  - {id: p8_sdxl, phase: P8, gpu: true, needs: [p5_bench_val], gates: [never], est_hours: null,
     notes: "deferred: separate budget and calibration per backbone", cmd: "false"}
  # ---------------------------------------------------------------- final report (partial results allowed) ------
  - {id: p9_final_report, phase: P9, gpu: false, needs: [p6_test_report, p7_ablations_report],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.final_report --store ${APSP_STORE} --run-id pilot1 --out ${APSP_STORE}/final",
     outputs: ["${APSP_STORE}/final/final_report.md"]}
