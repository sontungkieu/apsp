# Full SD1.5 experiment plan for `python -m apsp.run_project` (docs/FULL_EXPERIMENT_PLAN.md §9).
# Jobs run in this order when their dependencies, PREREG markers, gates, budget, price and watchdog allow it.
# Budget/price fields are RESEARCH/USER decisions: null blocks every GPU job. Agents never fill them in.
project_run: apsp_full_sd15_v1
instance_id: 56224386
measurement_gpu: null              # from runtime_fingerprint.json of the calibration run (not from the UI)
approved_total_usd: null           # user approves; cumulative across restarts (budget.json), never reset by RUN_ID
approved_max_usd_per_h: null       # price ceiling checked against the provider price at every start
approved_max_wall_hours: null
bandwidth_storage_reserve_usd: null
forecast_safety: 1.25              # job forecast multiplier in the budget preflight
pack_stop_margin_min: 20           # time kept for packing artifacts and stopping
scope: [sd15]
prereg: {A: null, B: null, C: null}   # informational; the gate reads docs/PREREG_SIGNED/ markers
resume: true
gpu_workers: 1
stop_instance_on_deadline: true
destroy_instance: false
runs_root: ${APSP_STORE}/project_runs
watchdog_state_dir: ${APSP_STORE}/watchdog
env:
  APSP_STORE: ${APSP_STORE}
  POOL_DIR: ${APSP_STORE}/prompts
  MACHINE_ID: vast_56224386_rtx4090_48g
  CAL: ${APSP_STORE}/runs/calib1
  COSTS: ${APSP_STORE}/runs/calib1/p0/m2/generator_costs.json
  TUNED: ${APSP_STORE}/tuned
  FROZEN: ${APSP_STORE}/frozen_operating_point.json

# est_hours: GPU wall hours used by the budget preflight. Values marked (3090) are the RTX 3090 estimates of
# docs/PILOT_RUN_PLAN.md, deliberately conservative for the 4090 until `p1_forecast` replaces them with measured ones.
jobs:
  # ---------------------------------------------------------------- P1 calibration (no PREREG; engineering) ----
  - {id: p1_env, phase: P1, gpu: true, est_hours: 0.15, timeout_min: 60,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 00_setup 01_pytest 02_env_check 02b_fingerprint 03_model && ${APSP_STORE}/venv-gpu/bin/python scripts/vram_check.py --out ${CAL}/p0/vram_check.json",
     outputs: ["${CAL}/p0/runtime_fingerprint.json", "${CAL}/p0/vram_check.json", "${CAL}/p0/M1_model.json"]}
  - {id: p1_pool_check, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.25, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 30_pool_full_check", outputs: ["${CAL}/calib/pool_full_check.json"]}
  - {id: p1_m3m9, phase: P1, gpu: true, needs: [p1_env], gates: [pool_frozen], est_hours: 2.2, timeout_min: 180,
     notes: "(3090) 50 calibration x bank 0 + fp32 preview, 20 subset x bank 1 clean collector",
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 31_calib_m3m9 32_calib_summary", outputs: ["${CAL}/calib/m3m9.json"]}
  - {id: p1_chunk, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.35, timeout_min: 40,
     cmd: "RUN_ID=calib1 CHUNK_N=50 bash scripts/gpu_smoke.sh 34_calib_chunk", outputs: ["${CAL}/calib/chunk.json"]}
  - {id: p1_m2, phase: P1, gpu: true, needs: [p1_env], est_hours: 0.7, timeout_min: 120,
     notes: "k = 1,2,3,4,8,12,16: every k of the pilot methods and of the B4b grid (16,12,8,4,3,2,1)",
     cmd: "RUN_ID=calib1 M2_KS='1 2 3 4 8 12 16' bash scripts/gpu_smoke.sh 35_m2 36_m2_merge",
     outputs: ["${COSTS}"]}
  - {id: p1_equivalence, phase: P1, gpu: true, needs: [p1_m3m9], est_hours: 0.35, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 33_calib_equivalence", outputs: ["${CAL}/calib/equivalence.json"]}
  - {id: p1_m2b, phase: P1, gpu: true, needs: [p1_m2], gates: [pool_frozen], est_hours: 0.25, timeout_min: 40,
     cmd: "RUN_ID=calib1 bash scripts/gpu_smoke.sh 37_m2b", outputs: ["${CAL}/calib/m2b.json"]}
  - {id: p1_m2_rest, phase: P1, gpu: true, needs: [p1_m2], est_hours: 1.5, enabled: false, timeout_min: 150,
     notes: "k = 5..7, 9..11, 13..15: only for any-N BoN / extended grids; not needed by this plan",
     cmd: "RUN_ID=calib1 M2_KS='5 6 7 9 10 11 13 14 15' bash scripts/gpu_smoke.sh 35_m2 36_m2_merge", outputs: ["${COSTS}"]}
  - {id: p1_forecast, phase: P1, gpu: false, needs: [p1_m3m9, p1_m2, p1_m2b],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.forecast --m3m9 ${CAL}/calib/m3m9.json --costs ${COSTS} --m2b ${CAL}/calib/m2b.json --price ${PRICE_USD_H} --out ${CAL}/forecast",
     outputs: ["${CAL}/forecast/phase_forecast.json"]}
  # ---------------------------------------------------------------- P2 bank (PREREG-A) -------------------------
  - {id: p2_bank, phase: P2, gpu: true, needs: [p1_forecast, p1_equivalence], prereg: [A], est_hours: 10.9, timeout_min: 900,
     notes: "(3090) 240 prompts x 2 banks x 81.9 s; replaced by the forecast",
     cmd: "RUN_ID=pilot1 COSTS=${COSTS} bash scripts/gpu_smoke.sh 40_bank", outputs: ["${APSP_STORE}/banks/PILOT/manifest.json"]}
  # ---------------------------------------------------------------- P3 baselines on train/dev (PREREG-A) -------
  - {id: p3_tune, phase: P3, gpu: false, needs: [p2_bank], prereg: [A],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.sim.tune_baselines --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS} --out ${TUNED}",
     outputs: ["${TUNED}/methods_frozen.json"]}
  - {id: p3_bench_dev, phase: P3, gpu: true, needs: [p3_tune], prereg: [A], est_hours: 10.3, timeout_min: 900,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS} bash scripts/gpu_smoke.sh 42_bench_dev", outputs: ["${APSP_STORE}/runs/pilot1/bench_dev/episodes.jsonl"]}
  - {id: p3_report_dev, phase: P3, gpu: false, needs: [p3_bench_dev], prereg: [A],
     notes: "descriptive table (not_concludable until evaluation.yaml is approved); no freeze here",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.quality_cost --run ${APSP_STORE}/runs/pilot1/bench_dev --out ${APSP_STORE}/runs/pilot1/bench_dev/report",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_dev/report/quality_cost.json"]}
  - {id: p3_anchor_proposal, phase: P3, gpu: false, needs: [p2_bank], prereg: [A],
     notes: "PREREG-B proposal inputs from train_fit only (anchor, tau_prac, epsilon, r_fail, sigma_R, power)",
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.anchor --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS} --proposal-only --out ${APSP_STORE}/runs/pilot1/anchor",
     outputs: ["${APSP_STORE}/runs/pilot1/anchor"]}
  - {id: p3_freeze_dev, phase: P3, gpu: false, needs: [p3_report_dev], prereg: [A], gates: [evaluation_approved],
     cmd: "RUN_ID=pilot1 bash scripts/gpu_smoke.sh 43_report_dev", outputs: ["${FROZEN}"]}
  - {id: p3_headroom, phase: P3, gpu: false, needs: [p2_bank], prereg: [B],
     cmd: "${APSP_STORE}/venv-gpu/bin/python -m apsp.reports.headroom --bank ${APSP_STORE}/banks/PILOT --costs ${COSTS} > ${APSP_STORE}/runs/pilot1/headroom.json",
     outputs: ["${APSP_STORE}/runs/pilot1/headroom.json"]}
  # ---------------------------------------------------------------- P4 controller (PREREG-B + G2) --------------
  - {id: p4_rl_train, phase: P4, gpu: false, needs: [p3_tune], prereg: [B], gates: ["marker:G2_EVALUATED"],
     cmd: "for s in 0 1 2; do ${APSP_STORE}/venv-gpu/bin/python -m apsp.policies.reinforce --config configs/pilot.yaml --train --bank ${APSP_STORE}/banks/PILOT --seed $s --out ${APSP_STORE}/rl/seed$s || exit 1; done",
     outputs: ["${APSP_STORE}/rl/seed0", "${APSP_STORE}/rl/seed1", "${APSP_STORE}/rl/seed2"]}
  # ---------------------------------------------------------------- P5 confirmation on val (PREREG-B) ----------
  - {id: p5_bench_val, phase: P5, gpu: true, needs: [p3_freeze_dev], prereg: [B], gates: [evaluation_approved],
     est_hours: 6.7, timeout_min: 900,
     cmd: "RUN_ID=pilot1 COSTS=${COSTS} FROZEN=${FROZEN} bash scripts/gpu_smoke.sh 44_bench_val 45_report_val",
     outputs: ["${APSP_STORE}/runs/pilot1/bench_val/report/quality_cost.json"]}
  # ---------------------------------------------------------------- P6 test, P7 ablations, P8 extension ---------
  - {id: p6_geneval, phase: P6, gpu: true, needs: [p5_bench_val], prereg: [C], gates: [never], est_hours: null,
     notes: "GenEval adapter not implemented before PREREG-C (official repo/weights pinned then)", cmd: "false"}
  - {id: p7_ablations, phase: P7, gpu: true, needs: [p3_freeze_dev], prereg: [B], gates: [never], est_hours: null,
     notes: "ablation list to be frozen before confirmation", cmd: "false"}
  - {id: p8_sdxl, phase: P8, gpu: true, needs: [p5_bench_val], gates: [never], est_hours: null,
     notes: "deferred: separate budget and calibration per backbone", cmd: "false"}
